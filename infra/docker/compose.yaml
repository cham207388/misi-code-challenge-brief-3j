name: memorial-ops

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [core, full]
    environment:
      POSTGRES_DB: memorialops
      POSTGRES_USER: memorial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorial -d memorialops"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    profiles: [core, full]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  rustfs-init:
    image: amazon/aws-cli@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
    profiles: [core, full]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://rustfs:9000
    volumes:
      - ./rustfs-init.sh:/rustfs-init.sh:ro
    entrypoint: ["/bin/sh", "/rustfs-init.sh"]

  sftp:
    image: atmoz/sftp:alpine@sha256:7e439fabeae536fa254340724c042e11999924d906417dbb5c73602ad518813f
    profiles: [mocks, full]
    command: ${SFTP_USERNAME}:${SFTP_PASSWORD}:1001:100:upload
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - sftpdata:/home/${SFTP_USERNAME}/upload
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd"]
      interval: 10s
      timeout: 5s
      retries: 10

  applicant-registry:
    image: brief3/mock-applicant-registry:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mock
      args:
        MODULE: applicant-registry
    profiles: [mocks, full]
    environment:
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12

  regional-calendar:
    image: brief3/mock-regional-calendar:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mock
      args:
        MODULE: regional-calendar
    profiles: [mocks, full]
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12

  notification-gateway:
    image: brief3/mock-notification-gateway:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mock
      args:
        MODULE: notification-gateway
    profiles: [mocks, full]
    environment:
      APP_WEBHOOK_URL: http://app:8080/api/webhooks/delivery
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12

  weather-advisory:
    image: brief3/mock-weather-advisory:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mock
      args:
        MODULE: weather-advisory
    profiles: [mocks, full]
    ports:
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12

  geocoding:
    image: brief3/mock-geocoding:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mock
      args:
        MODULE: geocoding
    profiles: [mocks, full]
    ports:
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12

  partner-feed:
    image: brief3/mock-partner-feed:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mock
      args:
        MODULE: partner-feed
    profiles: [mocks, full]
    ports:
      - "127.0.0.1:8086:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: brief3/app:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.app
    profiles: [core, full]
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memorialops
      SPRING_DATASOURCE_USERNAME: memorial
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REGISTRY_BASE_URL: http://applicant-registry:8080
      CALENDAR_BASE_URL: http://regional-calendar:8080
      NOTIFICATION_BASE_URL: http://notification-gateway:8080
      WEATHER_BASE_URL: http://weather-advisory:8080
      GEOCODING_BASE_URL: http://geocoding:8080
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      SFTP_HOST: sftp
      SFTP_USERNAME: ${SFTP_USERNAME}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 50s

volumes:
  pgdata:
  rustfsdata:
  sftpdata:
